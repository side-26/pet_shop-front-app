services:
  petshop-front-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - petshop_front_dev_node_modules:/app/node_modules
      - petshop_front_dev_next:/app/.next

volumes:
  petshop_front_dev_node_modules:
  petshop_front_dev_next:
