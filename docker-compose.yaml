services:
  petshop-front:
    build:
      context: .
      dockerfile: DockerFile.yaml
      args:
        API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env}
        NEXT_PUBLIC_SESSION_COOKIE_NAME: ${NEXT_PUBLIC_SESSION_COOKIE_NAME:?Set NEXT_PUBLIC_SESSION_COOKIE_NAME in .env}
        NEXT_PUBLIC_SESSION_SECRET_KEY: ${NEXT_PUBLIC_SESSION_SECRET_KEY:?Set NEXT_PUBLIC_SESSION_SECRET_KEY in .env}
        NEXT_PUBLIC_TEMPORARY_SESSION_SECRET_KEY: ${NEXT_PUBLIC_TEMPORARY_SESSION_SECRET_KEY:?Set NEXT_PUBLIC_TEMPORARY_SESSION_SECRET_KEY in .env}
        NEXT_PUBLIC_CART_STORAGE_KEY: ${NEXT_PUBLIC_CART_STORAGE_KEY:?Set NEXT_PUBLIC_CART_STORAGE_KEY in .env}
        NEXT_PUBLIC_NESHAN_API_KEY: ${NEXT_PUBLIC_NESHAN_API_KEY:?Set NEXT_PUBLIC_NESHAN_API_KEY in .env}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3001'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3001:3001'
    restart: unless-stopped
